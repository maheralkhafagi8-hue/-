<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="55%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="slateBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#borderGlow)" stroke-width="6" />

  <!-- Subtle Radial Ambient Glow Behind Clapperboard -->
  <circle cx="256" cy="266" r="175" fill="#f59e0b" fill-opacity="0.08" />

  <!-- Complete Clapperboard Group -->
  <g filter="url(#dropShadow)">
    <!-- Upper Hinged Clapper Stick (Tilted Open at -11 deg around left hinge) -->
    <g transform="rotate(-11, 108, 198)">
      <rect x="96" y="128" width="320" height="54" rx="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />
      <!-- Diagonal Gold Stripes on Upper Stick -->
      <polygon points="130,130 174,130 152,180 108,180" fill="url(#goldGrad)" />
      <polygon points="214,130 258,130 236,180 192,180" fill="url(#goldGrad)" />
      <polygon points="298,130 342,130 320,180 276,180" fill="url(#goldGrad)" />
      <polygon points="376,130 410,130 396,180 358,180" fill="url(#goldGrad)" />
    </g>

    <!-- Lower Fixed Clapper Bar -->
    <rect x="96" y="190" width="320" height="46" rx="10" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="130,192 174,192 152,234 108,234" fill="url(#goldGrad)" />
    <polygon points="214,192 258,192 236,234 192,234" fill="url(#goldGrad)" />
    <polygon points="298,192 342,192 320,234 276,234" fill="url(#goldGrad)" />
    <polygon points="376,192 410,192 396,234 358,234" fill="url(#goldGrad)" />

    <!-- Main Slate Board Body -->
    <rect x="96" y="232" width="320" height="184" rx="22" fill="url(#slateBody)" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Left Metallic Hinge Bracket -->
    <path d="M92 164 L138 164 C144 164 148 168 148 174 L148 228 C148 234 144 238 138 238 L92 238 Z" fill="#334155" stroke="#fbbf24" stroke-width="3" />
    <circle cx="114" cy="182" r="7" fill="#fbbf24" />
    <circle cx="114" cy="218" r="7" fill="#fbbf24" />
    <circle cx="132" cy="200" r="5" fill="#94a3b8" />

    <!-- Slate Grid Lines -->
    <line x1="120" y1="274" x2="392" y2="274" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="376" x2="392" y2="376" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="210" y1="274" x2="210" y2="376" stroke="#475569" stroke-width="3" />
    <line x1="302" y1="274" x2="302" y2="376" stroke="#475569" stroke-width="3" />

    <!-- Top Slate Metadata Bars -->
    <rect x="126" y="250" width="90" height="10" rx="5" fill="#fbbf24" fill-opacity="0.85" />
    <rect x="234" y="250" width="65" height="10" rx="5" fill="#94a3b8" fill-opacity="0.5" />
    <rect x="316" y="250" width="70" height="10" rx="5" fill="#94a3b8" fill-opacity="0.5" />

    <!-- Center Glowing Cinema Play Emblem -->
    <circle cx="256" cy="325" r="36" fill="#0b0f19" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="245,305 245,345 279,325" fill="url(#goldGrad)" />

    <!-- Bottom Slate Metadata Bars -->
    <rect x="134" y="390" width="76" height="8" rx="4" fill="#94a3b8" fill-opacity="0.45" />
    <rect x="228" y="390" width="144" height="8" rx="4" fill="#fbbf24" fill-opacity="0.7" />
  </g>
</svg>
