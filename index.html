<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason && String(e.reason.message || e.reason).indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function (e) {
          if (e && String(e.message || '').indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          var WrappedWS = function (url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
              var fakeTarget = new EventTarget();
              fakeTarget.readyState = 1;
              fakeTarget.send = function () {};
              fakeTarget.close = function () {};
              fakeTarget.addEventListener = EventTarget.prototype.addEventListener.bind(fakeTarget);
              fakeTarget.removeEventListener = EventTarget.prototype.removeEventListener.bind(fakeTarget);
              fakeTarget.dispatchEvent = EventTarget.prototype.dispatchEvent.bind(fakeTarget);
              setTimeout(function () {
                if (typeof fakeTarget.onopen === 'function') fakeTarget.onopen(new Event('open'));
                fakeTarget.dispatchEvent(new Event('open'));
              }, 10);
              return fakeTarget;
            }
            return protocols !== undefined ? new NativeWS(url, protocols) : new NativeWS(url);
          };
          WrappedWS.prototype = NativeWS.prototype;
          WrappedWS.CONNECTING = NativeWS.CONNECTING;
          WrappedWS.OPEN = NativeWS.OPEN;
          WrappedWS.CLOSING = NativeWS.CLOSING;
          WrappedWS.CLOSED = NativeWS.CLOSED;
          window.WebSocket = WrappedWS;
        }
      })();
    </script>
